name: Build desktop apps

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            label: macOS (Apple Silicon)
            artifact: Carrom-macOS-arm64
          - os: macos-13
            label: macOS (Intel)
            artifact: Carrom-macOS-x86_64
          - os: windows-latest
            label: Windows
            artifact: Carrom-Windows-x64

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PyInstaller
        run: python -m pip install --upgrade pip pyinstaller

      - name: Build (macOS)
        if: runner.os == 'macOS'
        run: |
          python -m PyInstaller --noconfirm --clean carrom.spec
          codesign --force --deep --sign - dist/Carrom.app
          hdiutil create -volname Carrom -srcfolder dist/Carrom.app -ov -format UDZO "dist/${{ matrix.artifact }}.dmg"

      - name: Build (Windows)
        if: runner.os == 'Windows'
        run: python -m PyInstaller --noconfirm --clean carrom.spec

      - name: Smoke test the bundle
        if: runner.os == 'macOS'
        run: test -x dist/Carrom.app/Contents/MacOS/Carrom

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            dist/*.dmg
            dist/Carrom.exe
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
